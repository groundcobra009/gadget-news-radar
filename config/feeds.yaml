# ガジェットニュース収集元（正本: ~/Downloads/gadget_rss_sources.csv を移植・26本）
# priority: A=主力（推奨度の初期スコアが高い） / B=補助
# enabled: false にすると収集対象から外れる（コード修正不要）
# notes は判定プロンプトには渡さない（運用メモ）

- id: getnews
  name: ガジェット通信
  url: https://getnews.jp/feed
  priority: A
  region: 国内
  focus: 話題系ガジェット・ネットカルチャー
  enabled: true
  notes: 広告・イベント記事が多いため厳選

- id: itmedia-news
  name: ITmedia NEWS
  url: https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml
  priority: A
  region: 国内
  focus: テクノロジー・AI・業界動向
  enabled: true
  notes: 一次情報へのリンク確認を推奨

- id: itmedia-mobile
